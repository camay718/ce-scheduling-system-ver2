<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定 - CEスケジュール管理システム V2</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/theme-unified.css">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../js/config/firebase-config.js"></script>

    <script src="../js/utils/audit-logger.js"></script>
    <script src="../js/utils/ui-utils.js"></script>
    <script src="../js/core/auth-guard.js"></script>

    <style>
        .settings-layout { display: flex; height: 100vh; overflow: hidden; }
        .settings-sidebar {
            width: 300px; background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            transition: width 0.3s ease;
            position: relative; flex-shrink: 0;
        }
        .settings-sidebar.collapsed { width: 60px; }
        .sidebar-content {
            padding: 20px; width: 300px;
            transition: opacity 0.3s ease;
            flex: 1; overflow-y: auto;
            display: flex; flex-direction: column;
        }
        .settings-sidebar.collapsed .sidebar-content {
            opacity: 0; pointer-events: none;
        }
        .sidebar-toggle {
            position: absolute; top: 15px; right: -15px;
            background: var(--brand-primary); color: white;
            border: none; border-radius: 50%;
            width: 30px; height: 30px; cursor: pointer;
            z-index: 101; display: flex; align-items: center; justify-content: center;
        }
        .main-content { flex: 1; padding: 24px; overflow-y: auto; }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.75rem; font-weight: 700;
            color: var(--brand-primary);
        }
        .stat-label {
            font-size: 0.75rem; color: var(--text-color-light);
            margin-top: 4px;
        }

        .tab-bar {
            display: flex; gap: 4px;
            border-bottom: 2px solid rgba(0,0,0,0.06);
            margin-bottom: 12px; flex-wrap: wrap;
        }
        .tab-btn {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 8px 8px 0 0;
            background: transparent;
            color: var(--text-color-light);
            cursor: pointer;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 600;
        }
        .tab-btn.active {
            color: var(--brand-primary);
            background: rgba(76,175,80,0.06);
            border-bottom-color: var(--brand-primary);
        }
        .tab-btn .tab-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            font-size: 11px;
            border-radius: 999px;
            background: #e5e7eb;
            color: #374151;
        }

        .activity-item {
            display: grid;
            grid-template-columns: 28px 1fr auto;
            gap: 10px;
            align-items: start;
            padding: 10px 12px;
            border-left: 4px solid #d1d5db;
            background: #ffffff;
            border-radius: 8px;
            margin-bottom: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .activity-item:hover { background: #f9fafb; }
        .activity-icon {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #f3f4f6;
            color: #4b5563;
            font-size: 13px;
        }
        .activity-body { min-width: 0; }
        .activity-headline {
            font-size: 13px; line-height: 1.5;
        }
        .activity-actor {
            font-weight: 700; color: #111827;
        }
        .activity-role-badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 6px;
            background: #e5e7eb;
            color: #374151;
            vertical-align: middle;
        }
        .activity-role-badge.admin  { background: #fee2e2; color: #b91c1c; }
        .activity-role-badge.editor { background: #dbeafe; color: #1d4ed8; }
        .activity-role-badge.viewer { background: #e5e7eb; color: #374151; }

        .activity-action {
            font-weight: 600; color: #374151;
            margin-left: 4px;
        }
        .activity-target {
            color: #4b5563;
            margin-left: 4px;
        }
        .activity-meta {
            font-size: 11px;
            color: #6b7280;
            margin-top: 3px;
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .activity-meta .chip {
            padding: 1px 6px;
            border-radius: 4px;
            background: #f3f4f6;
        }
        .activity-meta .chip.dept { background: #ecfdf5; color: #065f46; }
        .activity-meta .chip.page { background: #eef2ff; color: #3730a3; }
        .activity-meta .chip.date { background: #fef3c7; color: #92400e; }

        .activity-time {
            font-size: 11px;
            color: #6b7280;
            white-space: nowrap;
        }

        /* 種別ごとの左バー色 */
        .activity-item.type-login    { border-left-color: #16a34a; }
        .activity-item.type-logout   { border-left-color: #6b7280; }
        .activity-item.type-add      { border-left-color: #0ea5e9; }
        .activity-item.type-edit     { border-left-color: #f59e0b; }
        .activity-item.type-delete   { border-left-color: #dc2626; }
        .activity-item.type-assign   { border-left-color: #7c3aed; }
        .activity-item.type-unassign { border-left-color: #f97316; }
        .activity-item.type-publish  { border-left-color: #0d9488; }
        .activity-item.type-template { border-left-color: #14b8a6; }
        .activity-item.type-monthly  { border-left-color: #4f46e5; }
        .activity-item.type-page     { border-left-color: #cbd5e1; }
        .activity-item.type-system   { border-left-color: #94a3b8; }
        .activity-item.type-user     { border-left-color: #db2777; }
        .activity-item.type-other    { border-left-color: #9ca3af; }

        .connection-status {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px;
            padding: 8px 10px;
            background: #f0fdf4; border-radius: 6px;
            margin-bottom: 12px;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #16a34a;
        }
        .status-dot.offline { background: #dc2626; }

        @media (max-width: 768px) {
            .settings-sidebar {
                position: fixed; top: 0; left: 0; height: 100vh;
                transform: translateX(-100%); z-index: 100;
            }
            .settings-sidebar.expanded { transform: translateX(0); }
            .main-content { padding: 16px; }
            .activity-item { grid-template-columns: 24px 1fr; }
            .activity-time { grid-column: 2 / 3; text-align: left; }
        }
    </style>
</head>
<body class="theme-unified">
    <div id="loading" class="center-layout">
        <div class="glass-card center-card text-center">
            <div class="spinner mb-4"></div>
            <p class="text-gray-600">設定画面を読み込んでいます...</p>
        </div>
    </div>

    <div id="mainInterface" class="settings-layout" style="display:none;">
        <!-- サイドバー -->
        <div id="sidebar" class="settings-sidebar">
            <button id="toggleSidebar" class="sidebar-toggle" title="サイドバー表示/非表示">
                <i class="fas fa-bars"></i>
            </button>

            <div class="sidebar-content">
                <div class="mb-4 text-center">
                    <h1 class="text-lg font-bold text-gray-800 mb-1">
                        <i class="fas fa-cog mr-2 text-green-600"></i>設定管理
                    </h1>
                    <p class="text-xs text-gray-600">CEスケジュール管理システム V2</p>
                    <div class="mt-2 text-xs text-gray-600">
                        <span id="currentUserDisplay">ユーザー</span>
                    </div>
                </div>

                <div class="connection-status">
                    <div id="connectionDot" class="status-dot"></div>
                    <span id="connectionText">リアルタイム同期中</span>
                </div>

                <div class="mb-4">
                    <h3 class="text-sm font-semibold mb-2">
                        <i class="fas fa-filter mr-2"></i>フィルター
                    </h3>
                    <div class="space-y-2">
                        <div>
                            <label class="block text-xs font-medium mb-1">期間</label>
                            <select id="timeFilter" class="input-unified text-xs">
                                <option value="today">今日</option>
                                <option value="week" selected>過去7日</option>
                                <option value="month">過去30日</option>
                                <option value="all">全期間</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">ユーザー</label>
                            <select id="userFilter" class="input-unified text-xs">
                                <option value="">全ユーザー</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">キーワード</label>
                            <input id="keywordFilter" type="text" class="input-unified text-xs" placeholder="業務名/CE名/ページ名など">
                        </div>
                        <label class="flex items-center gap-2 text-xs">
                            <input type="checkbox" id="myActionsOnly">
                            自分の操作のみ
                        </label>
                        <label class="flex items-center gap-2 text-xs">
                            <input type="checkbox" id="hidePageAccess" checked>
                            ページアクセスを隠す
                        </label>
                    </div>
                    <div class="mt-2 grid grid-cols-2 gap-2">
                        <button id="applyFiltersBtn" class="btn-unified btn-primary-unified btn-small">
                            <i class="fas fa-search mr-1"></i>適用
                        </button>
                        <button id="clearFiltersBtn" class="btn-unified btn-outline-unified btn-small">
                            <i class="fas fa-eraser mr-1"></i>クリア
                        </button>
                    </div>
                </div>

                <div id="adminSection" style="display:none;">
                    <h3 class="text-sm font-semibold mb-2 text-red-600">
                        <i class="fas fa-shield-alt mr-2"></i>管理者機能
                    </h3>
                    <div class="space-y-2">
                        <button id="exportLogsBtn" class="btn-unified btn-outline-unified btn-small w-full">
                            <i class="fas fa-file-export mr-1"></i>ログエクスポート
                        </button>
                        <button id="clearOldLogsBtn" class="btn-unified btn-outline-unified btn-small w-full text-red-600 border-red-600">
                            <i class="fas fa-trash mr-1"></i>古いログ削除
                        </button>
                        <a href="./admin-dashboard.html" class="btn-unified btn-primary-unified btn-small w-full text-center block">
                            <i class="fas fa-users-cog mr-1"></i>ユーザー管理
                        </a>
                    </div>
                </div>

                <div class="mt-auto text-center pt-4">
                    <a href="./home.html" class="btn-unified btn-outline-unified btn-small w-full">
                        <i class="fas fa-home mr-1"></i>HOME
                    </a>
                    <button onclick="window.handleLogout()" class="btn-unified btn-outline-unified btn-small w-full mt-2 text-red-600 border-red-600">
                        <i class="fas fa-sign-out-alt mr-1"></i>ログアウト
                    </button>
                </div>
            </div>
        </div>

        <!-- メイン -->
        <div class="main-content">
            <div class="flex items-center mb-4">
                <i class="fas fa-history text-green-600 text-2xl mr-3"></i>
                <div>
                    <h2 class="text-xl font-bold text-gray-800">設定・変更履歴</h2>
                    <p class="text-xs text-gray-500">
                        システム利用状況と変更履歴をリアルタイムで確認できます
                    </p>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                <div class="stat-card">
                    <div id="statTotalLogs" class="stat-value">0</div>
                    <div class="stat-label">総ログ数</div>
                </div>
                <div class="stat-card">
                    <div id="statTodayActivity" class="stat-value">0</div>
                    <div class="stat-label">今日のアクティビティ</div>
                </div>
                <div class="stat-card">
                    <div id="statActiveUsers" class="stat-value">0</div>
                    <div class="stat-label">アクティブユーザー(24H)</div>
                </div>
                <div class="stat-card">
                    <div id="statImportantToday" class="stat-value">0</div>
                    <div class="stat-label">今日の重要操作</div>
                </div>
            </div>

            <div class="glass-card p-4">
                <div class="tab-bar">
                    <button class="tab-btn active" data-tab="important">
                        <i class="fas fa-star mr-1"></i>重要操作
                        <span class="tab-badge" id="tabCountImportant">0</span>
                    </button>
                    <button class="tab-btn" data-tab="all">
                        <i class="fas fa-list mr-1"></i>すべて
                        <span class="tab-badge" id="tabCountAll">0</span>
                    </button>
                    <button class="tab-btn" data-tab="event">
                        <i class="fas fa-briefcase mr-1"></i>業務変更
                        <span class="tab-badge" id="tabCountEvent">0</span>
                    </button>
                    <button class="tab-btn" data-tab="ce">
                        <i class="fas fa-user-nurse mr-1"></i>CE配置
                        <span class="tab-badge" id="tabCountCE">0</span>
                    </button>
                    <button class="tab-btn" data-tab="schedule">
                        <i class="fas fa-calendar-check mr-1"></i>勤務表
                        <span class="tab-badge" id="tabCountSchedule">0</span>
                    </button>
                    <button class="tab-btn" data-tab="user">
                        <i class="fas fa-users mr-1"></i>ユーザー
                        <span class="tab-badge" id="tabCountUser">0</span>
                    </button>
                    <button class="tab-btn" data-tab="login">
                        <i class="fas fa-sign-in-alt mr-1"></i>ログイン
                        <span class="tab-badge" id="tabCountLogin">0</span>
                    </button>
                    <button class="tab-btn" data-tab="page">
                        <i class="fas fa-eye mr-1"></i>アクセス
                        <span class="tab-badge" id="tabCountPage">0</span>
                    </button>
                </div>

                <div class="flex items-center justify-between mb-3 text-xs text-gray-600">
                    <div>
                        表示中: <span id="visibleCount">0</span>件 /
                        取得済: <span id="totalCount">0</span>件
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="pauseUpdatesBtn" class="btn-unified btn-outline-unified btn-small">
                            <i class="fas fa-pause mr-1"></i>停止
                        </button>
                        <button id="loadMoreBtn" class="btn-unified btn-primary-unified btn-small">
                            <i class="fas fa-plus mr-1"></i>さらに読み込む
                        </button>
                    </div>
                </div>

                <div id="activityLogContainer">
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p>ログを読み込んでいます...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
class SettingsManager {
    constructor() {
        this.activityLogs = [];
        this.filteredLogs = [];
        this.users = new Map();
        this.isPaused = false;
        this.realtimeRef = null;
        this.maxLogs = 300;
        this.oldestTimestamp = null;
        this.currentTab = 'important';
        this.init();
    }

    async init() {
        try {
            const authSuccess = await AuthGuard.init();
            if (!authSuccess) return;

            const userData = await AuthGuard.getUserData();
            if (!userData || !userData.setupCompleted) {
                console.error('ユーザーデータ不正');
                location.href = '../index.html';
                return;
            }

            const session = AuthGuard.getSession();
            window.userRole = userData.role || session.role || 'viewer';
            window.currentUserData = {
                ...userData,
                uid: userData.uid || session.uid || sessionStorage.getItem('targetUID') || '',
                username: userData.username || session.username || sessionStorage.getItem('currentUsername') || '',
                displayName: userData.displayName || userData.username || session.username || 'ユーザー',
                role: window.userRole
            };

            await this.initializeSettingsSystem();
        } catch (error) {
            console.error('設定管理初期化エラー:', error);
            location.href = '../index.html';
        }
    }

    async initializeSettingsSystem() {
        this.showSettings();
        this.setupEventListeners();
        this.setupConnectionMonitor();
        await this.loadUsers();
        await this.setupRealtimeActivityLog();
        this.updateStats();

        if (window.auditLogger) {
            await window.auditLogger.logPageAccess('settings');
        }
    }

    showSettings() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainInterface').style.display = 'flex';
        this.updateUserDisplay();
        this.setupAdminControls();
    }

    updateUserDisplay() {
        const u = window.currentUserData;
        const displayName = u.displayName || u.username || 'ユーザー';
        document.querySelectorAll('#currentUserDisplay').forEach(el => {
            el.textContent = `${displayName} (${u.role})`;
        });
    }

    setupAdminControls() {
        const adminSection = document.getElementById('adminSection');
        if (adminSection && window.userRole === 'admin') {
            adminSection.style.display = 'block';
        }
    }

    setupConnectionMonitor() {
        try {
            window.database.ref('.info/connected').on('value', (snapshot) => {
                const connected = snapshot.val();
                const dot = document.getElementById('connectionDot');
                const text = document.getElementById('connectionText');
                if (connected) {
                    dot.className = 'status-dot';
                    text.textContent = 'リアルタイム同期中';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = 'オフライン(再接続待機)';
                }
            });
        } catch (e) {
            console.warn('接続監視設定エラー:', e);
        }
    }

    setupEventListeners() {
        const toggle = document.getElementById('toggleSidebar');
        const sidebar = document.getElementById('sidebar');
        if (toggle && sidebar) {
            toggle.onclick = () => sidebar.classList.toggle('expanded');
        }

        document.getElementById('applyFiltersBtn')?.addEventListener('click', () => this.applyFilters());
        document.getElementById('clearFiltersBtn')?.addEventListener('click', () => this.clearFilters());
        document.getElementById('pauseUpdatesBtn')?.addEventListener('click', () => this.toggleUpdates());
        document.getElementById('loadMoreBtn')?.addEventListener('click', () => this.loadMoreLogs());
        document.getElementById('exportLogsBtn')?.addEventListener('click', () => this.exportLogs());
        document.getElementById('clearOldLogsBtn')?.addEventListener('click', () => this.clearOldLogs());
        document.getElementById('keywordFilter')?.addEventListener('input', () => this.applyFilters());
        document.getElementById('hidePageAccess')?.addEventListener('change', () => this.applyFilters());

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.currentTab = btn.dataset.tab;
                this.applyFilters();
            });
        });
    }

    async loadUsers() {
        try {
            const snap = await window.database.ref(`${window.DATA_ROOT}/users`).once('value');
            const usersData = snap.val() || {};
            this.users.clear();
            Object.entries(usersData).forEach(([uid, user]) => {
                if (user.setupCompleted) {
                    this.users.set(uid, {
                        uid,
                        username: user.username,
                        displayName: user.displayName || user.username,
                        role: user.role || 'viewer'
                    });
                }
            });
            this.updateUserFilter();
        } catch (e) {
            console.error('❌ ユーザーリスト読み込みエラー:', e);
        }
    }

    updateUserFilter() {
        const uf = document.getElementById('userFilter');
        if (!uf) return;
        while (uf.children.length > 1) uf.removeChild(uf.lastChild);
        Array.from(this.users.values())
            .sort((a, b) => a.displayName.localeCompare(b.displayName, 'ja'))
            .forEach(user => {
                const opt = document.createElement('option');
                opt.value = user.uid;
                opt.textContent = `${user.displayName} (${user.role})`;
                uf.appendChild(opt);
            });
    }

    async setupRealtimeActivityLog() {
        try {
            const initSnap = await window.database.ref(`${window.DATA_ROOT}/auditLogs`)
                .orderByChild('timestamp')
                .limitToLast(this.maxLogs)
                .once('value');

            this.activityLogs = [];
            if (initSnap.exists()) {
                const logsData = initSnap.val();
                Object.entries(logsData).forEach(([key, log]) => {
                    if (log.timestamp) this.activityLogs.push({ id: key, ...log });
                });
                this.activityLogs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                this.oldestTimestamp = this.activityLogs.length > 0
                    ? this.activityLogs[this.activityLogs.length - 1].timestamp
                    : null;
            }

            this.setupRealtimeListener();
            this.applyFilters();
            this.updateStats();
        } catch (e) {
            console.error('❌ リアルタイム変更履歴初期化エラー:', e);
            this.displayError('変更履歴の読み込みに失敗しました');
        }
    }

    setupRealtimeListener() {
        if (this.realtimeRef) this.realtimeRef.off();
        const latest = this.activityLogs.length > 0 ? this.activityLogs[0].timestamp : 0;
        this.realtimeRef = window.database.ref(`${window.DATA_ROOT}/auditLogs`)
            .orderByChild('timestamp')
            .startAt(latest ? latest + 1 : 0);

        this.realtimeRef.on('child_added', (snap) => {
            if (this.isPaused) return;
            const log = snap.val();
            if (log && log.timestamp) {
                this.addLogEntry({ id: snap.key, ...log });
            }
        });
    }

    addLogEntry(logEntry) {
        if (this.activityLogs.some(l => l.id === logEntry.id)) return;
        this.activityLogs.unshift(logEntry);
        if (this.activityLogs.length > this.maxLogs * 2) {
            this.activityLogs = this.activityLogs.slice(0, this.maxLogs);
        }
        this.applyFilters();
        this.updateStats();
    }

    // ==== フィルタ・分類 ====
    classify(action) {
        if (!action) return 'other';
        if (action === 'login') return 'login';
        if (action === 'logout') return 'login';
        if (action === 'page-access' || action === 'analytics-page-access') return 'page';
        if (action.startsWith('event-')) return 'event';
        if (action.startsWith('ce-')) return 'ce';
        if (action.startsWith('schedule-')) return 'schedule';
        if (action.startsWith('monthly-')) return 'event';
        if (action.startsWith('template-')) return 'event';
        if (action.startsWith('user-')) return 'user';
        if (action.startsWith('system-')) return 'other';
        return 'other';
    }

    isImportant(action) {
        if (!action) return false;
        if (action === 'page-access' || action === 'analytics-page-access') return false;
        // login/logoutも重要とみなす
        return true;
    }

    matchesTab(log) {
        const cat = this.classify(log.action);
        switch (this.currentTab) {
            case 'important': return this.isImportant(log.action);
            case 'all':       return true;
            case 'event':     return cat === 'event';
            case 'ce':        return cat === 'ce';
            case 'schedule':  return cat === 'schedule';
            case 'user':      return cat === 'user';
            case 'login':     return cat === 'login';
            case 'page':      return cat === 'page';
            default:          return true;
        }
    }

    applyFilters() {
        const timeFilter = document.getElementById('timeFilter')?.value || 'week';
        const userFilter = document.getElementById('userFilter')?.value || '';
        const keyword = (document.getElementById('keywordFilter')?.value || '').trim().toLowerCase();
        const myOnly = document.getElementById('myActionsOnly')?.checked || false;
        const hidePage = document.getElementById('hidePageAccess')?.checked || false;

        const now = Date.now();
        const timeThreshold = {
            today: now - 24 * 3600 * 1000,
            week:  now - 7 * 24 * 3600 * 1000,
            month: now - 30 * 24 * 3600 * 1000,
            all:   0
        }[timeFilter] ?? 0;

        const myUid = window.currentUserData?.uid;

        this.filteredLogs = this.activityLogs.filter(log => {
            if (!log.timestamp || log.timestamp < timeThreshold) return false;
            if (userFilter && log.uid !== userFilter) return false;
            if (myOnly && log.uid !== myUid) return false;
            if (hidePage && this.classify(log.action) === 'page' && this.currentTab !== 'page') return false;

            if (!this.matchesTab(log)) return false;

            if (keyword) {
                const hay = [
                    log.username, log.displayName, log.action,
                    log.details?.pageName,
                    log.details?.eventName,
                    log.details?.ceName,
                    log.details?.taskName,
                    log.details?.department,
                    log.details?.dateKey,
                    log.details?.name
                ].filter(Boolean).join(' ').toLowerCase();
                if (!hay.includes(keyword)) return false;
            }
            return true;
        });

        this.renderActivityLog();
        this.updateTabBadges();
    }

    updateTabBadges() {
        const now = Date.now();
        const timeFilter = document.getElementById('timeFilter')?.value || 'week';
        const timeThreshold = {
            today: now - 24 * 3600 * 1000,
            week:  now - 7 * 24 * 3600 * 1000,
            month: now - 30 * 24 * 3600 * 1000,
            all:   0
        }[timeFilter] ?? 0;

        const inRange = this.activityLogs.filter(l => l.timestamp && l.timestamp >= timeThreshold);

        const count = (fn) => inRange.filter(fn).length;

        const setBadge = (id, n) => {
            const el = document.getElementById(id);
            if (el) el.textContent = n;
        };
        setBadge('tabCountImportant', count(l => this.isImportant(l.action)));
        setBadge('tabCountAll',       inRange.length);
        setBadge('tabCountEvent',     count(l => this.classify(l.action) === 'event'));
        setBadge('tabCountCE',        count(l => this.classify(l.action) === 'ce'));
        setBadge('tabCountSchedule',  count(l => this.classify(l.action) === 'schedule'));
        setBadge('tabCountUser',      count(l => this.classify(l.action) === 'user'));
        setBadge('tabCountLogin',     count(l => this.classify(l.action) === 'login'));
        setBadge('tabCountPage',      count(l => this.classify(l.action) === 'page'));
    }

    clearFilters() {
        document.getElementById('timeFilter').value = 'week';
        document.getElementById('userFilter').value = '';
        document.getElementById('keywordFilter').value = '';
        document.getElementById('myActionsOnly').checked = false;
        document.getElementById('hidePageAccess').checked = true;
        this.currentTab = 'important';
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === 'important');
        });
        this.applyFilters();
    }

    // ==== 表示 ====
    renderActivityLog() {
        const container = document.getElementById('activityLogContainer');
        const visibleEl = document.getElementById('visibleCount');
        const totalEl = document.getElementById('totalCount');

        if (visibleEl) visibleEl.textContent = this.filteredLogs.length;
        if (totalEl) totalEl.textContent = this.activityLogs.length;

        if (!container) return;

        if (this.filteredLogs.length === 0) {
            container.innerHTML = `
                <div class="text-center py-8 text-gray-500">
                    <i class="fas fa-search text-2xl mb-3"></i>
                    <p>条件に一致する履歴がありません</p>
                </div>`;
            return;
        }

        container.innerHTML = '';
        this.filteredLogs.forEach(log => {
            container.appendChild(this.createLogElement(log));
        });
    }

    createLogElement(log) {
        const div = document.createElement('div');
        const typeClass = this.getTypeClass(log.action);
        div.className = `activity-item type-${typeClass}`;

        const user = this.users.get(log.uid);
        const displayName =
            user?.displayName || log.displayName || log.username || '不明なユーザー';
        const role = (user?.role || log.role || 'viewer').toLowerCase();

        const time = log.timestamp
            ? new Date(log.timestamp).toLocaleString('ja-JP', {
                month: 'numeric', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
              })
            : '不明な時刻';

        const actionLabel = this.getActionLabel(log);
        const target = this.getTargetLabel(log);
        const iconClass = this.getActionIcon(log.action);

        const meta = this.buildMeta(log);

        div.innerHTML = `
            <div class="activity-icon"><i class="${iconClass}"></i></div>
            <div class="activity-body">
                <div class="activity-headline">
                    <span class="activity-actor">${this.escape(displayName)}</span>
                    <span class="activity-role-badge ${role}">${this.roleLabel(role)}</span>
                    <span class="activity-action">${this.escape(actionLabel)}</span>
                    ${target ? `<span class="activity-target">${this.escape(target)}</span>` : ''}
                </div>
                ${meta ? `<div class="activity-meta">${meta}</div>` : ''}
            </div>
            <div class="activity-time">${time}</div>
        `;
        return div;
    }

    escape(s) {
        return String(s ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    roleLabel(role) {
        return ({ admin: '管理者', editor: '編集者', viewer: '閲覧者' })[role] || '不明';
    }

    getTypeClass(action) {
        if (!action) return 'other';
        if (action === 'login') return 'login';
        if (action === 'logout') return 'logout';
        if (action === 'page-access' || action === 'analytics-page-access') return 'page';
        if (action.endsWith('-add') || action === 'event-bulk-add' || action.startsWith('monthly-')) return 'add';
        if (action.endsWith('-edit') || action.endsWith('-update') || action.endsWith('-rename')) return 'edit';
        if (action.endsWith('-delete') || action.endsWith('-remove')) return 'delete';
        if (action === 'ce-assign') return 'assign';
        if (action === 'ce-unassign') return 'unassign';
        if (action === 'schedule-publish') return 'publish';
        if (action.startsWith('template-')) return 'template';
        if (action.startsWith('monthly-')) return 'monthly';
        if (action.startsWith('user-')) return 'user';
        return 'other';
    }

getActionIcon(action) {
    const map = {
        'login': 'fas fa-sign-in-alt',
        'logout': 'fas fa-sign-out-alt',
        'page-access': 'fas fa-eye',
        'analytics-page-access': 'fas fa-chart-line',
        'event-add': 'fas fa-plus',
        'event-edit': 'fas fa-pen',
        'event-delete': 'fas fa-trash',
        'event-bulk-add': 'fas fa-layer-group',
        'event-copy': 'fas fa-copy',
        'ce-assign': 'fas fa-user-plus',
        'ce-unassign': 'fas fa-user-minus',
        'schedule-create': 'fas fa-calendar-plus',
        'schedule-edit': 'fas fa-calendar-day',
        'schedule-delete': 'fas fa-trash',
        'schedule-publish': 'fas fa-bullhorn',
        'schedule-ce-add': 'fas fa-user-plus',
        'schedule-ce-remove': 'fas fa-user-minus',
        'template-create': 'fas fa-bookmark',
        'template-apply': 'fas fa-magic',
        'template-delete': 'fas fa-eraser',
        'template-rename': 'fas fa-i-cursor',
        'template-reorder': 'fas fa-sort',
        'monthly-create': 'fas fa-calendar-alt',
        'monthly-update': 'fas fa-calendar-check',
        'monthly-delete': 'fas fa-calendar-minus',
        'monthly-task-copy': 'fas fa-copy',
        'user-create': 'fas fa-user-plus',
        'user-pending-delete': 'fas fa-user-times',
        'user-role-change': 'fas fa-user-shield',
        'user-password-reset': 'fas fa-key',
        'user-delete': 'fas fa-user-times',
        'user-permissions-update': 'fas fa-lock'
    };
    return map[action] || 'fas fa-circle-info';
}

    getActionLabel(log) {
    const map = {
        'login': 'ログイン',
        'logout': 'ログアウト',
        'page-access': 'ページ閲覧',
        'analytics-page-access': '分析ページ閲覧',
        'event-add': '業務を追加',
        'event-edit': '業務を編集',
        'event-delete': '業務を削除',
        'event-bulk-add': '業務を一括追加',
        'event-copy': '業務をコピー',
        'ce-assign': 'CEを配置',
        'ce-unassign': 'CE配置を解除',
        'schedule-create': '勤務表を保存',
        'schedule-edit': '勤務表を上書き保存',
        'schedule-delete': '勤務表を削除',
        'schedule-publish': '勤務表を公開',
        'schedule-ce-add': 'CEを追加',
        'schedule-ce-remove': 'CEを削除',
        'template-create': 'テンプレを作成',
        'template-apply': 'テンプレを適用',
        'template-delete': 'テンプレを削除',
        'template-rename': 'テンプレ名を変更',
        'template-reorder': 'テンプレ順序変更',
        'monthly-create': '月次業務を追加',
        'monthly-update': '月次業務を更新',
        'monthly-delete': '月次業務を削除',
        'monthly-task-copy': '月次業務コピー',
        'user-create': 'ユーザーを作成',
        'user-pending-delete': '待機ユーザーを削除',
        'user-role-change': '権限を変更',
        'user-password-reset': 'パスワードをリセット',
        'user-delete': 'ユーザーを削除',
        'user-permissions-update': 'viewer権限設定を更新',
        'weekly-view-print': '週間表を印刷'
    };
    return map[log.action] || (log.action || '操作');
}

    getTargetLabel(log) {
        const d = log.details || {};
        if (d.eventName && d.eventName !== 'unknown') return `｢${d.eventName}｣`;
        if (d.taskName && d.taskName !== 'unknown') return `｢${d.taskName}｣`;
        if (d.ceName && d.ceName !== 'unknown') return `｢${d.ceName}｣`;
        if (d.name) return `｢${d.name}｣`;
        if (d.pageName) return `→ ${this.pageLabel(d.pageName)}`;
        return '';
    }

    pageLabel(pageName) {
        const map = {
            'home': 'HOME',
            'schedule': '日別スケジュール',
            'weekly-view': '週間表示',
            'ce-schedule': 'CE勤務表',
            'settings': '設定',
            'analytics': '集計・分析',
            'admin-dashboard': '管理者ダッシュボード',
            'work-schedule-editor': '勤務表エディタ',
            'assignment-summary': '配置サマリ',
            'department-timeline': '部門タイムライン',
            'personal-timeline': '個人タイムライン',
            'staffing-adjustment': '人員調整',
            'user-setup': '個人設定'
        };
        return map[pageName] || pageName;
    }

    buildMeta(log) {
        const d = log.details || {};
        const chips = [];

        if (d.department && d.department !== 'unknown') {
            chips.push(`<span class="chip dept">${this.escape(d.department)}</span>`);
        }
        if (d.dateKey) {
            chips.push(`<span class="chip date">${this.escape(d.dateKey)}</span>`);
        } else if (d.yearMonth) {
            chips.push(`<span class="chip date">${this.escape(d.yearMonth)}</span>`);
        }
        if (d.pageName && this.classify(log.action) !== 'page') {
            chips.push(`<span class="chip page">${this.escape(this.pageLabel(d.pageName))}</span>`);
        } else if (d.page && this.classify(log.action) !== 'page') {
            chips.push(`<span class="chip page">${this.escape(this.pageLabel(d.page))}</span>`);
        }
        if (typeof d.addedCount === 'number') {
            chips.push(`<span class="chip">${d.addedCount}件追加</span>`);
        }
        if (typeof d.totalAdded === 'number') {
            chips.push(`<span class="chip">${d.totalAdded}件追加</span>`);
        }
        if (d.workType && d.workType !== 'unknown') {
            chips.push(`<span class="chip">${this.escape(d.workType)}</span>`);
        }
        return chips.join('');
    }

    // ==== 統計 ====
    updateStats() {
        const now = Date.now();
        const dayAgo = now - 24 * 3600 * 1000;

        const totalEl = document.getElementById('statTotalLogs');
        const todayEl = document.getElementById('statTodayActivity');
        const usersEl = document.getElementById('statActiveUsers');
        const impEl   = document.getElementById('statImportantToday');

        const recent = this.activityLogs.filter(l => l.timestamp && l.timestamp >= dayAgo);
        const activeUsers = new Set(recent.map(l => l.uid).filter(Boolean));

        const todayImportant = recent.filter(l => this.isImportant(l.action));

        if (totalEl) totalEl.textContent = this.activityLogs.length;
        if (todayEl) todayEl.textContent = recent.length;
        if (usersEl) usersEl.textContent = activeUsers.size;
        if (impEl)   impEl.textContent   = todayImportant.length;
    }

    // ==== コントロール ====
    toggleUpdates() {
        this.isPaused = !this.isPaused;
        const btn = document.getElementById('pauseUpdatesBtn');
        if (!btn) return;
        btn.innerHTML = this.isPaused
            ? '<i class="fas fa-play mr-1"></i>再開'
            : '<i class="fas fa-pause mr-1"></i>停止';
    }

    async loadMoreLogs() {
        if (!this.oldestTimestamp) return;
        try {
            const snap = await window.database.ref(`${window.DATA_ROOT}/auditLogs`)
                .orderByChild('timestamp')
                .endAt(this.oldestTimestamp - 1)
                .limitToLast(this.maxLogs)
                .once('value');
            const data = snap.val() || {};
            Object.entries(data).forEach(([key, log]) => {
                if (!this.activityLogs.some(l => l.id === key)) {
                    this.activityLogs.push({ id: key, ...log });
                }
            });
            this.activityLogs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            this.oldestTimestamp = this.activityLogs.length > 0
                ? this.activityLogs[this.activityLogs.length - 1].timestamp
                : this.oldestTimestamp;
            this.applyFilters();
            this.updateStats();
        } catch (e) {
            console.error('追加ログ読み込み失敗:', e);
            window.showMessage?.('追加ログ読み込みに失敗しました', 'error');
        }
    }

    exportLogs() {
        if (window.userRole !== 'admin') {
            window.showMessage?.('管理者権限が必要です', 'warning');
            return;
        }
        const rows = this.filteredLogs.map(log => ({
            日時: log.timestamp ? new Date(log.timestamp).toLocaleString('ja-JP') : '',
            ユーザー: this.users.get(log.uid)?.displayName || log.displayName || '不明',
            権限: log.role || this.users.get(log.uid)?.role || '',
            操作: this.getActionLabel(log),
            対象: this.getTargetLabel(log).replace(/[｢｣]/g, ''),
            部門: log.details?.department || '',
            日付: log.details?.dateKey || log.details?.yearMonth || '',
            ページ: log.details?.pageName || log.details?.page || ''
        }));
        if (rows.length === 0) {
            window.showMessage?.('エクスポート対象がありません', 'info');
            return;
        }
        const header = Object.keys(rows[0]);
        const csv = [
            header.join(','),
            ...rows.map(r => header.map(h => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))
        ].join('\n');

        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `audit-logs-${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    async clearOldLogs() {
        if (window.userRole !== 'admin') {
            window.showMessage?.('管理者権限が必要です', 'warning');
            return;
        }
        const days = prompt('何日前より古いログを削除しますか？(数値のみ)', '30');
        if (!days || isNaN(days) || Number(days) <= 0) {
            window.showMessage?.('有効な日数を入力してください', 'warning');
            return;
        }
        if (!confirm(`${days}日前より古いログを削除します。元に戻せません。`)) return;

        try {
            const cutoff = Date.now() - (parseInt(days) * 24 * 3600 * 1000);
            const ref = window.database.ref(`${window.DATA_ROOT}/auditLogs`);
            const snap = await ref.orderByChild('timestamp').endBefore(cutoff).once('value');
            const old = snap.val();
            if (!old) {
                window.showMessage?.('削除対象のログがありません', 'info');
                return;
            }
            const updates = {};
            Object.keys(old).forEach(k => { updates[k] = null; });
            await ref.update(updates);
            window.showMessage?.(`${Object.keys(old).length}件の古いログを削除しました`, 'success');

            this.activityLogs = this.activityLogs.filter(l => l.timestamp >= cutoff);
            this.applyFilters();
            this.updateStats();
        } catch (e) {
            console.error('古いログ削除失敗:', e);
            window.showMessage?.('削除に失敗しました', 'error');
        }
    }

    displayError(msg) {
        const c = document.getElementById('activityLogContainer');
        if (c) {
            c.innerHTML = `
                <div class="text-center py-8 text-red-600">
                    <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
                    <p>${this.escape(msg)}</p>
                </div>`;
        }
    }
}

// 共通ログアウト
window.handleLogout = async () => {
    try {
        if (window.auditLogger) await window.auditLogger.logAction('logout');
        if (window.auth?.currentUser) await window.auth.signOut();
    } catch (e) {
        console.error('ログアウトエラー:', e);
    } finally {
        sessionStorage.clear();
        localStorage.removeItem('dashboardAuth');
        location.href = '../index.html';
    }
};

document.addEventListener('DOMContentLoaded', () => {
    new SettingsManager();
});
